[package]
name = "director-narrative-core-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", features = ["napi4", "serde-json"] }
napi-derive = "2"
director-narrative-core = { path = ".." }
serde_json  = "1"

[build-dependencies]
napi-build = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
